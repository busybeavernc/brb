name: Build

# Every push to main runs the tests (on Windows: a few minutes). A release is built only on request, because private
# repositories have limited free Actions minutes (Mac machines count 10x):
#   - GitHub > Actions > Build > "Run workflow", or
#   - a push whose commit message contains [release]
# A release builds BRB (formerly Doppleganger) and publishes vMAJOR.MINOR.<build #> with:
#   BRBSetup.exe                Windows installer (Start menu, uninstall entry, removes the camera on uninstall)
#   BRB.exe                     the Windows app itself (installed copies update themselves from this)
#   doppleganger-publisher.cer  the public half of the self-signed code-signing certificate
#   BRB-mac-arm64.dmg           Mac (Apple Silicon) - drag to Applications; uses OBS Virtual Camera
#   BRB-mac-x86_64.dmg          Mac (Intel)
#   BRB-mac-*.zip               the same apps, for the Mac's self-update
# Code signing runs when the SIGNING_CERT_PFX_BASE64 / SIGNING_CERT_PASSWORD secrets are set.
on:
  push:
    branches: [main]
    paths-ignore:            # the download page (GitHub Pages) doesn't need a new app build
      - "index.html"
      - "docs/**"
  workflow_dispatch:
    inputs:
      mac:
        description: "Also build the Mac apps (otherwise Windows only; the website keeps offering the last Mac version)"
        type: boolean
        default: false

concurrency:                 # a newer push replaces a test run that hasn't finished; releases are never cancelled
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) && 'release' || 'test' }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) }}

permissions:                 # least privilege: only the release jobs can write
  contents: read

env:
  # Build numbers continue from the old "Build Windows app" workflow (last release v0.1.15).
  BUILD_OFFSET: 15
  # Downloads live in the public repo busybeavernc/doppleganger-public (this code repo can be private).
  # PUBLIC_RELEASES_TOKEN: fine-grained token with Contents: read & write on that repo only.
  PUBLIC_REPO: busybeavernc/doppleganger-public
  PUBLIC_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
  SIGN_PFX: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
  SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q tests

  # Every push: compile BRB's Mac OBS-camera helper on a real Mac and make sure it loads and searches the cameras
  # (no OBS on the build machine, so "not found" is the expected answer). Nothing is published.
  mac-helper:
    if: ${{ !(github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile (Intel and Apple Silicon)
        run: |
          for arch in x86_64 arm64; do
            clang -dynamiclib -fobjc-arc -O2 -Wall -arch $arch -mmacosx-version-min=13.0 \
              -framework Foundation -framework CoreMediaIO -framework CoreMedia -framework CoreVideo \
              -o libbrbobscam-$arch.dylib driver/macos/obscam.m
          done
          lipo -info libbrbobscam-x86_64.dylib libbrbobscam-arm64.dylib
      - name: Load and look for OBS Virtual Camera
        run: |
          python3 - <<'PY'
          import ctypes
          lib = ctypes.CDLL("./libbrbobscam-x86_64.dylib")
          w, h, f = ctypes.c_int(), ctypes.c_int(), ctypes.c_uint32()
          err = ctypes.create_string_buffer(200)
          rc = lib.brb_obs_open(b"OBS Virtual Camera", ctypes.byref(w), ctypes.byref(h), ctypes.byref(f), err, 200)
          print("brb_obs_open ->", rc, err.value.decode())
          assert rc == 1 and err.value == b"not found", "expected: OBS camera not installed on the build machine"
          lib.brb_obs_close()
          print("helper loads and searches the cameras: OK")
          PY

  windows:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Stamp version
        id: ver
        shell: bash
        run: |
          base=$(python -c "import re;print('.'.join(re.search(r'\"(\d+)\.(\d+)', open('doppleganger/__init__.py').read()).groups()))")
          v="$base.$(( ${{ github.run_number }} + BUILD_OFFSET ))"
          echo "VERSION = \"$v\"" > doppleganger/_build.py
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # ---- The "Doppleganger" camera: softcam (MIT) renamed and built for 64- and 32-bit apps ----
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build Doppleganger camera driver
        shell: pwsh
        run: |
          git clone --quiet https://github.com/tshino/softcam driver_src
          git -C driver_src checkout --quiet 6f5d8f9b5f7dc37a86a119b881bc75e1860fb3ec
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $line = & $vswhere -latest -property catalog_productLineVersion
          $toolset = if ([int]$line -ge 2026) { "v145" } else { "v143" }
          Write-Host "Visual Studio $line -> toolset $toolset"
          python driver/patch_softcam.py driver_src $toolset
          if ($LASTEXITCODE) { exit 1 }
          $sol = (Resolve-Path driver_src).Path + "\"
          foreach ($plat in "x64", "Win32") {
            msbuild driver_src\src\softcam\softcam.vcxproj /m /v:minimal /p:Configuration=Release /p:Platform=$plat "/p:SolutionDir=$sol"
            if ($LASTEXITCODE) { exit 1 }
          }
          New-Item -ItemType Directory -Force driver_build | Out-Null
          $dll64 = Get-ChildItem driver_src\x64\Release -Recurse -Filter softcam.dll | Select-Object -First 1
          $dll32 = Get-ChildItem driver_src\Win32\Release -Recurse -Filter softcam.dll | Select-Object -First 1
          Copy-Item $dll64.FullName driver_build\doppleganger_cam64.dll
          Copy-Item $dll32.FullName driver_build\doppleganger_cam32.dll
          Copy-Item driver\SOFTCAM-LICENSE.txt driver_build\

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Build helpers (camera list, microphone mute)
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /utf-8 driver\listcams.cpp /Fe:driver_build\listcams.exe /Fo:driver_build\ ole32.lib oleaut32.lib strmiids.lib || exit /b 1
          cl /nologo /O2 /EHsc /utf-8 driver\micmute.cpp /Fe:driver_build\micmute.exe /Fo:driver_build\ ole32.lib || exit /b 1
          driver_build\listcams.exe
          driver_build\micmute.exe list

      - name: Prepare code-signing certificate
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          "SIGN_FILE=$env:RUNNER_TEMP\sign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign camera driver and helpers
        if: env.SIGN_PFX != ''
        shell: cmd
        run: signtool sign /q /fd SHA256 /f "%SIGN_FILE%" /p "%SIGN_PASSWORD%" /tr http://timestamp.digicert.com /td SHA256 /d "BRB" driver_build\doppleganger_cam64.dll driver_build\doppleganger_cam32.dll driver_build\listcams.exe driver_build\micmute.exe

      - name: Third-party notices
        run: python tools/third_party_notices.py THIRD-PARTY-NOTICES.txt

      - name: Build BRB.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name BRB
          --icon doppleganger/assets/icon.ico
          --splash doppleganger/assets/splash.png
          --add-data "doppleganger/assets;doppleganger/assets"
          --add-data "driver_build/doppleganger_cam64.dll;driver"
          --add-data "driver_build/doppleganger_cam32.dll;driver"
          --add-data "driver_build/listcams.exe;driver"
          --add-data "driver_build/micmute.exe;driver"
          --add-data "driver_build/SOFTCAM-LICENSE.txt;driver"
          --add-data "THIRD-PARTY-NOTICES.txt;."
          --collect-data cv2
          --collect-all mediapipe
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          launcher.py

      - name: Sign BRB.exe
        if: env.SIGN_PFX != ''
        shell: cmd
        run: signtool sign /q /fd SHA256 /f "%SIGN_FILE%" /p "%SIGN_PASSWORD%" /tr http://timestamp.digicert.com /td SHA256 /d "BRB" dist\BRB.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\doppleganger.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Sign installer
        if: env.SIGN_PFX != ''
        shell: cmd
        run: signtool sign /q /fd SHA256 /f "%SIGN_FILE%" /p "%SIGN_PASSWORD%" /tr http://timestamp.digicert.com /td SHA256 /d "BRB Setup" dist\BRBSetup.exe

      - name: Remove signing certificate
        if: always() && env.SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\sign.pfx"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/BRB.exe
            dist/BRBSetup.exe

  mac:
    # Mac builds only when asked: "Run workflow" with "Also build the Mac apps" ticked, or [mac] in the commit message
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mac) || (contains(github.event.head_commit.message, '[release]') && contains(github.event.head_commit.message, '[mac]')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26        # Apple Silicon (macos-15 arm64 runners were out of capacity)
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^mediapipe' requirements.txt > req-base.txt
          pip install -r req-base.txt pyinstaller pytest
          # AI person detection; if MediaPipe has no build for this Mac, the app uses room calibration.
          pip install "$(grep '^mediapipe' requirements.txt | cut -d'#' -f1 | xargs)" || echo "::warning::MediaPipe unavailable on ${{ matrix.arch }}"

      - name: Run tests
        run: python -m pytest -q tests

      - name: Stamp version
        id: ver
        run: |
          base=$(python -c "import re;print('.'.join(re.search(r'\"(\d+)\.(\d+)', open('doppleganger/__init__.py').read()).groups()))")
          v="$base.$(( ${{ github.run_number }} + BUILD_OFFSET ))"
          echo "VERSION = \"$v\"" > doppleganger/_build.py
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the OBS camera helper
        run: |
          mkdir -p driver_build
          clang -dynamiclib -fobjc-arc -O2 -Wall -arch ${{ matrix.arch }} -mmacosx-version-min=13.0 \
            -framework Foundation -framework CoreMediaIO -framework CoreMedia -framework CoreVideo \
            -install_name @rpath/libbrbobscam.dylib -o driver_build/libbrbobscam.dylib driver/macos/obscam.m
          nm -gU driver_build/libbrbobscam.dylib | grep brb_obs_

      - name: Third-party notices
        run: python tools/third_party_notices.py THIRD-PARTY-NOTICES.txt

      - name: Build BRB.app
        env:
          DOPPLEGANGER_VERSION: ${{ steps.ver.outputs.version }}
        run: pyinstaller --noconfirm installer/doppleganger-mac.spec

      - name: Self-test the app
        run: dist/BRB.app/Contents/MacOS/BRB --selftest

      - name: Sign (ad hoc), zip and make the disk image
        run: |
          codesign --force --deep --sign - dist/BRB.app
          codesign --verify --deep dist/BRB.app
          name=BRB-mac-${{ matrix.arch }}
          ditto -c -k --keepParent dist/BRB.app "dist/$name.zip"
          mkdir dmg && cp -R dist/BRB.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname BRB -srcfolder dmg -ov -format UDZO "dist/$name.dmg"
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/BRB-mac-${{ matrix.arch }}.dmg
            dist/BRB-mac-${{ matrix.arch }}.zip

  # Windows is released as soon as it's built; the Mac files are added to the same release
  # when they're ready (Mac build machines can sit in GitHub's queue for a while).
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write            # create the release
      id-token: write            # sign the build provenance
      attestations: write
    outputs:
      tag: ${{ steps.pub.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: artifacts

      # A signed record of which workflow run built each file, from which commit; anyone can check a download with
      # `gh attestation verify BRBSetup.exe --repo busybeavernc/doppleganger`
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/BRBSetup.exe
            artifacts/BRB.exe

      - name: Publish release
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(python3 -c "import re;print('.'.join(re.search(r'\"(\d+)\.(\d+)', open('doppleganger/__init__.py').read()).groups()))")
          v="$base.$(( ${{ github.run_number }} + BUILD_OFFSET ))"
          notes="**Download:** https://brb.happyhacks.io/ (picks the right file for your computer).

          **Windows:** BRBSetup.exe. **Mac:** BRB-mac-arm64.dmg (Apple Silicon) or BRB-mac-x86_64.dmg (Intel) when this release includes them (otherwise the download page offers the latest Mac version); needs [OBS Studio](https://obsproject.com/download) 30+.

          $(git log -1 --pretty=%s)"
          # Doppleganger.exe: the same app under its old name, so copies installed before the rename to BRB update
          # themselves (their updater looks for that file name)
          cp artifacts/BRB.exe artifacts/Doppleganger.exe
          files="artifacts/BRBSetup.exe artifacts/BRB.exe artifacts/Doppleganger.exe installer/doppleganger-publisher.cer"
          gh release create "v$v" $files --title "BRB $v" --notes "$notes" --target "$GITHUB_SHA" --latest
          if [ -n "$PUBLIC_TOKEN" ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release create "v$v" $files -R "$PUBLIC_REPO" \
              --title "BRB $v" --notes "$notes" --latest
          else
            echo "::warning::PUBLIC_RELEASES_TOKEN not set - release published to this repo only"
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  mac-release:
    needs: [release, mac]
    if: always() && needs.release.result == 'success' && needs.mac.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mac-*
          merge-multiple: true
          path: artifacts

      - name: Build provenance
        if: hashFiles('artifacts/*.dmg', 'artifacts/*.zip') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip

      - name: Add the Mac apps to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' \) | sort)
          echo "$files"
          if [ -z "$files" ]; then echo "::warning::No Mac build succeeded this time"; exit 0; fi
          gh release upload "${{ needs.release.outputs.tag }}" $files --clobber -R "$GITHUB_REPOSITORY"
          if [ -n "$PUBLIC_TOKEN" ]; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release upload "${{ needs.release.outputs.tag }}" $files --clobber -R "$PUBLIC_REPO"
          fi
